name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - run: pip install -e ".[test,pdf]"
      - run: pytest -q
      - run: shellcheck -S warning linux/*.sh

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q
      - name: Installer end-to-end (fake export)
        shell: powershell
        run: |
          python tests\make_fake_export.py "$env:RUNNER_TEMP\export"
          .\windows\install.ps1 -NonInteractive -SchoolName "CI School" `
            -Export "$env:RUNNER_TEMP\export\au_wa_testschool" `
            -AdminUser ciadmin -AdminPassword "a long ci password here"
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/login
          if ($r.Content -notmatch "SEQTA Archive") { throw "login page not served" }
          & "$env:ProgramFiles\SEQTA Archive\venv\Scripts\seqta-archive.exe" check
          if ($LASTEXITCODE -ne 0) { throw "check failed" }
          # PDF via Edge
          & "$env:ProgramFiles\SEQTA Archive\venv\Scripts\python.exe" -c "from seqta_archive import pdf; b = pdf.render('<h1>ci</h1>'); assert b and b[:5] == b'%PDF-', pdf.engine(); print('pdf via', pdf.engine())"

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t seqta-archive:ci .
      - name: Smoke test (fake export)
        run: |
          python3 tests/make_fake_export.py /tmp/x
          mkdir -p /tmp/data && chmod 777 /tmp/data
          docker run --rm -v /tmp/x:/export:ro -v /tmp/data:/data seqta-archive:ci build --export /export --out /data/seqta.db
          docker run -d --name a -p 8080:8080 -e COOKIE_SECURE=0 -v /tmp/data:/data:ro -v /tmp/x:/export:ro seqta-archive:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/readyz && break; sleep 1; done
          curl -fsS localhost:8080/login | grep -q "SEQTA Archive"
          echo "a long docker password" | docker exec -i a seqta-archive user add admin --admin --password-stdin
          docker exec a seqta-archive check
      - name: Publish image (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}
          V=${GITHUB_REF_NAME#v}
          docker tag seqta-archive:ci $IMG:$V && docker tag seqta-archive:ci $IMG:latest
          docker push $IMG:$V && docker push $IMG:latest
