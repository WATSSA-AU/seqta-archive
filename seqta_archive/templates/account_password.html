{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block main %}
<section class="card auth">
  <h1>Change password</h1>
  {% if u.must_change %}<p class="banner">Choose your own password before continuing.</p>{% endif %}
  {% if error %}<p class="banner bad">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
    <label>New password <span class="dim small">(at least {{ min_len }} characters; a short sentence works well)</span>
      <input name="new" type="password" autocomplete="new-password" minlength="{{ min_len }}" required></label>
    <label>New password again <input name="again" type="password" autocomplete="new-password" required></label>
    <button type="submit">Save password</button>
  </form>
</section>
{% endblock %}
