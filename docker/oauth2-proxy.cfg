## oauth2-proxy settings for the SEQTA Archive (used by compose.oidc.yaml).
## Secrets come from the environment: OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET.

## ---- Your identity provider ------------------------------------------------
## Keycloak:
provider = "keycloak-oidc"
oidc_issuer_url = "https://login.example.school/realms/YOUR-REALM"
## Microsoft Entra ID:  provider = "entra-id"
##                      oidc_issuer_url = "https://login.microsoftonline.com/<tenant-id>/v2.0"
## Google Workspace:    provider = "google"   (use email allow-lists instead of groups)
client_id = "seqta-archive"
code_challenge_method = "S256"
redirect_url = "https://archive.example.school/oauth2/callback"

## ---- Who gets in -----------------------------------------------------------
## The archive needs a "groups" claim containing seqta-archive-users and/or seqta-archive-admin
## (rename them with ACCESS_GROUPS / ADMIN_GROUPS in .env if your IdP uses other names).
email_domains = ["*"]
allowed_groups = ["seqta-archive-users", "seqta-archive-admin"]

## ---- Plumbing (leave as is) --------------------------------------------------
http_address = "0.0.0.0:4180"
upstreams = ["http://archive:8080/"]
upstream_timeout = "300s"
reverse_proxy = true
skip_provider_button = true
pass_user_headers = true
pass_access_token = false
skip_auth_routes = ["GET=^/healthz$", "GET=^/readyz$"]
cookie_name = "_seqta_archive"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "8h"
cookie_refresh = "1h"
session_store_type = "redis"
redis_connection_url = "redis://redis:6379/0"
